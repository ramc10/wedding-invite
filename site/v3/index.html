<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2416">
<title>Bhavya &amp; Ramcharan</title>
<meta name="description" content="Join us as we celebrate our wedding.">
<!-- Open Graph / Twitter Card — what WhatsApp, iMessage, Slack etc. show when
     this link is shared. Needs an absolute image URL (a relative path or data
     URI won't unfurl), so this is pinned to the deployed origin rather than
     left relative like every other asset reference in this file. Update the
     og:url/og:image host if the project ever moves to a custom domain. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Bhavya &amp; Ramcharan">
<meta property="og:description" content="Join us as we celebrate our wedding.">
<meta property="og:image" content="https://wedding-invite-a0glgctj7.vercel.app/v3/art/og-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://wedding-invite-a0glgctj7.vercel.app/v3/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bhavya &amp; Ramcharan">
<meta name="twitter:description" content="Join us as we celebrate our wedding.">
<meta name="twitter:image" content="https://wedding-invite-a0glgctj7.vercel.app/v3/art/og-preview.jpg">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="preload" as="image" href="art/ribbon-000.webp">
<link rel="stylesheet" href="road.css">
</head>
<body>

<!-- the ground plane: one painted ribbon, moved by a single transform -->
<div class="world" aria-hidden="true">
  <div class="ribbon" id="ribbon"></div>
  <div class="streaks" id="streaks"></div>
  <div class="vignette"></div>
</div>

<!-- atmosphere, above the ground, below the car -->
<div class="clouds" id="clouds" aria-hidden="true"></div>

<!-- the car sits still; the world moves under it -->
<div class="car-anchor" aria-hidden="true">
  <div class="car-drop">
    <div class="car-track" id="car">
      <div class="car-idle"><canvas id="car3d"></canvas></div>
    </div>
  </div>
</div>

<div class="tint" id="tint" aria-hidden="true"></div>
<div class="dusk" id="dusk" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>

<!-- scroll spine: one section per stop, each drive-then-hold -->
<main class="legs" id="legs"></main>

<nav class="rail" id="rail" aria-label="Route"></nav>
<div class="cue" id="cue" aria-hidden="true"><span></span></div>

<div class="title" id="title"><h1><span class="first-name">Bhavya</span> <span class="amp" aria-hidden="true">&amp;</span><span class="amp-word">and</span> <span class="second-name">Ramcharan</span></h1></div>

<div class="venue" id="titleVenue">
  <p class="details-place">Bengaluru</p>
</div>

<div class="details" id="details">
  <ul class="details-events">
    <li><span class="details-ceremony">Reception By the Shore</span><span class="details-when">November 17th, 7 PM</span></li>
    <li><span class="details-ceremony">Haldi</span><span class="details-when">November 18th, 8 AM</span></li>
    <li><span class="details-ceremony">Muhurtham</span><span class="details-when">November 18th, 8 PM</span></li>
  </ul>
</div>

<div class="venue" id="venue">
  <p class="details-place">Palm Beach Hotel<br>Vishakapatnam</p>
</div>

<div class="dam-caption" id="damCaption">
  <ul class="details-events">
    <li><span class="details-ceremony">Dawat by the Manair</span><span class="details-when">November 21st, 7 PM</span></li>
  </ul>
</div>

<div class="venue" id="damVenue">
  <p class="details-place">AMR Unnati Convention<br>Karimnagar</p>
</div>

<div class="title" id="ending"><h1>The Beginning</h1></div>

<div class="venue" id="endingVenue">
  <p class="details-place">of everything</p>
</div>

<!-- defer, not blocking: ~700KB of Three.js + loaders would otherwise hold the
     whole ribbon/scroll experience hostage until they finish downloading, for
     what is visually a small car icon. defer keeps document order (these three
     still finish before road.js runs) while letting the browser parse and
     paint the rest of the page immediately instead of waiting on this fetch. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js" defer></script>
<script src="road.js" defer></script>
</body>
</html>
